services:
  # ===============================================================
  # DB API Gateway
  # Connects directly to the Common PostgreSQL Database (shared_postgres)
  # Acts as the secure barrier, validating 7 headers, checking CRUD/DDL
  # permissions, detecting SQLi, and logging audit events.
  # ===============================================================
  db-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: db-api-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      API_BASE_URL: ${API_BASE_URL:-https://db.mhservice.co.in}
      PG_HOST: ${PG_HOST:-shared_postgres}
      PG_PORT: ${PG_PORT:-5432}
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres_master_pass_2026}
      PG_DEFAULT_DATABASE: ${PG_DEFAULT_DATABASE:-postgres}
      PG_SSL: "false"
      ADMIN_SECRET: ${ADMIN_SECRET:-mh_admin_super_secret_key_2026}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 120
      DATA_DIR: /app/data
    volumes:
      - api_data:/app/data
    networks:
      - coolify
      - db-internal-network

  # ===============================================================
  # Optional Local PostgreSQL Database for standalone offline debugging
  # Activated only when needed with: docker compose --profile local-db up
  # ===============================================================
  postgres:
    profiles:
      - local-db
    image: postgres:16-alpine
    container_name: db-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DEFAULT_DATABASE:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - db-internal-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DEFAULT_DATABASE:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

networks:
  coolify:
    name: coolify
    external: true
  db-internal-network:
    driver: bridge
    name: db-internal-network

volumes:
  pg_data:
    name: db-postgres-data
  api_data:
    name: db-api-metadata
