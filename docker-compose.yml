services:
  # ===============================================================
  # Protected PostgreSQL Database
  # Kept inside the internal Docker network to prevent direct WAN access
  # ===============================================================
  postgres:
    image: postgres:16-alpine
    container_name: db-postgres-local
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-postgres}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-postgres}
      POSTGRES_DB: ${PG_DEFAULT_DATABASE:-postgres}
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - db-internal-network
    # Notice: Port 5432 is kept internal to protect the DB from direct internet exposure.
    # Uncomment only if you need direct localhost debugging:
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-postgres} -d ${PG_DEFAULT_DATABASE:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===============================================================
  # DB API Gateway
  # Acts as the secure barrier, validating 7 headers, checking CRUD/DDL
  # permissions, detecting SQLi, and logging audit events.
  # ===============================================================
  db-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: db-api-gateway
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
      API_BASE_URL: ${API_BASE_URL:-https://db.mhservice.co.in}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-postgres}
      PG_PASSWORD: ${PG_PASSWORD:-postgres}
      PG_DEFAULT_DATABASE: ${PG_DEFAULT_DATABASE:-postgres}
      PG_SSL: "false"
      ADMIN_SECRET: ${ADMIN_SECRET:-mh_admin_super_secret_key_2026}
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX_REQUESTS: 120
      DATA_DIR: /app/data
    volumes:
      - api_data:/app/data
    networks:
      - db-internal-network
    depends_on:
      postgres:
        condition: service_healthy

networks:
  db-internal-network:
    driver: bridge
    name: db-internal-network

volumes:
  pg_data:
    name: db-postgres-data
  api_data:
    name: db-api-metadata
