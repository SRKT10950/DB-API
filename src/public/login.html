<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - DB API Gateway</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="/admin/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            brand: {
              50: '#f0f9ff',
              100: '#e0f2fe',
              500: '#0284c7',
              600: '#0369a1',
              700: '#075985',
              900: '#0c4a6e',
            },
            dark: {
              800: '#1e293b',
              850: '#172033',
              900: '#0f172a',
              950: '#080d1a',
            }
          }
        }
      }
    }
  </script>
  <style>
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-anim {
      animation: shake 0.35s ease-in-out;
    }
  </style>
</head>
<body class="bg-dark-950 text-slate-100 min-h-screen flex items-center justify-center p-4 font-sans antialiased relative overflow-hidden">

  <!-- Ambient background glow elements -->
  <div class="absolute -top-40 -left-40 w-96 h-96 bg-sky-600/10 rounded-full blur-3xl pointer-events-none"></div>
  <div class="absolute -bottom-40 -right-40 w-96 h-96 bg-indigo-600/10 rounded-full blur-3xl pointer-events-none"></div>

  <!-- Login Card -->
  <div class="max-w-md w-full bg-dark-900/90 backdrop-blur-xl border border-slate-800 rounded-2xl p-8 shadow-2xl relative z-10">
    
    <!-- Brand Header -->
    <div class="flex flex-col items-center text-center mb-8">
      <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-sky-500 to-indigo-600 flex items-center justify-center shadow-xl shadow-sky-500/25 mb-4">
        <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
      </div>
      <h1 class="text-xl font-extrabold tracking-tight text-white flex items-center gap-2">
        <span>DB API Admin Portal</span>
        <span class="text-[10px] px-2 py-0.5 rounded-full bg-sky-500/10 text-sky-400 font-semibold border border-sky-500/20">v1.0</span>
      </h1>
      <p class="text-xs text-slate-400 mt-1">PostgreSQL Security Gateway & Management Console</p>
      <p class="text-[11px] text-slate-500 font-mono mt-0.5">https://db.mhservice.co.in</p>
    </div>

    <!-- Error Alert Banner -->
    <div id="errorBanner" class="hidden mb-5 p-3 rounded-xl bg-rose-500/10 border border-rose-500/30 text-rose-400 text-xs flex items-start gap-2.5">
      <svg class="w-4 h-4 shrink-0 mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
      </svg>
      <span id="errorMessage">Invalid credentials. Please try again.</span>
    </div>

    <!-- Login Form -->
    <form id="loginForm" class="space-y-4">
      <div>
        <label for="usernameInput" class="block text-xs font-semibold text-slate-300 mb-1.5">
          Admin Username
        </label>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
            </svg>
          </div>
          <input 
            type="text" 
            id="usernameInput" 
            name="username" 
            value="admin"
            class="w-full bg-dark-800/80 border border-slate-700/80 text-xs pl-9 pr-3 py-2.5 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition font-mono" 
            placeholder="admin" 
            required
          >
        </div>
      </div>

      <div>
        <div class="flex items-center justify-between mb-1.5">
          <label for="secretInput" class="block text-xs font-semibold text-slate-300">
            Admin Secret / Password
          </label>
        </div>
        <div class="relative">
          <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z" />
            </svg>
          </div>
          <input 
            type="password" 
            id="secretInput" 
            name="secret" 
            class="w-full bg-dark-800/80 border border-slate-700/80 text-xs pl-9 pr-10 py-2.5 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:border-sky-500 focus:ring-1 focus:ring-sky-500 transition font-mono" 
            placeholder="Enter Admin Secret Key" 
            required 
            autofocus
          >
          <button 
            type="button" 
            id="togglePasswordBtn" 
            class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-500 hover:text-slate-300 transition"
          >
            <svg id="eyeIcon" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
            </svg>
          </button>
        </div>
      </div>

      <div class="flex items-center justify-between pt-1">
        <label class="flex items-center space-x-2 text-xs text-slate-400 cursor-pointer select-none">
          <input type="checkbox" id="rememberMe" checked class="rounded border-slate-700 bg-dark-800 text-sky-600 focus:ring-0">
          <span>Remember session</span>
        </label>
        <span class="text-[11px] text-slate-500 font-mono">Protected by DB Firewall</span>
      </div>

      <button 
        type="submit" 
        id="submitBtn" 
        class="w-full mt-2 py-2.5 px-4 rounded-xl bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 text-white font-semibold text-xs shadow-lg shadow-sky-600/20 transition flex items-center justify-center gap-2 disabled:opacity-50"
      >
        <span id="btnText">Sign In to Admin Console</span>
        <svg id="btnSpinner" class="w-4 h-4 animate-spin hidden" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
        </svg>
      </button>
    </form>

    <!-- Footer info -->
    <div class="mt-8 pt-4 border-t border-slate-800/80 text-center">
      <p class="text-[11px] text-slate-500">
        MH Service DB API Gateway • Enterprise Database Security
      </p>
    </div>

  </div>

  <script>
    const form = document.getElementById('loginForm');
    const secretInput = document.getElementById('secretInput');
    const usernameInput = document.getElementById('usernameInput');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');
    const togglePasswordBtn = document.getElementById('togglePasswordBtn');

    // Auto-check existing session on load
    document.addEventListener('DOMContentLoaded', async () => {
      const existingToken = localStorage.getItem('dbapi_auth_token') || localStorage.getItem('dbapi_admin_secret');
      if (existingToken) {
        try {
          const res = await fetch('/admin/api/auth/verify', {
            headers: { 'Authorization': 'Bearer ' + existingToken }
          });
          const data = await res.json();
          if (data.success && data.valid) {
            // Already logged in! Redirect to dashboard
            window.location.replace('/admin/');
            return;
          }
        } catch (e) {
          // Token invalid, proceed to login
        }
      }
    });

    // Toggle password visibility
    togglePasswordBtn.addEventListener('click', () => {
      const isPassword = secretInput.type === 'password';
      secretInput.type = isPassword ? 'text' : 'password';
    });

    // Form Submission
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorBanner.classList.add('hidden');
      
      const username = usernameInput.value.trim();
      const secret = secretInput.value.trim();

      if (!secret) return;

      // Set loading state
      submitBtn.disabled = true;
      btnText.textContent = 'Authenticating...';
      btnSpinner.classList.remove('hidden');

      try {
        const res = await fetch('/admin/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, secret })
        });

        const data = await res.json();

        if (res.ok && data.success && data.token) {
          // Store auth session
          localStorage.setItem('dbapi_auth_token', data.token);
          localStorage.setItem('dbapi_admin_secret', data.token);
          if (data.user) {
            localStorage.setItem('dbapi_admin_user', JSON.stringify(data.user));
          }

          btnText.textContent = 'Redirecting...';
          window.location.replace('/admin/');
        } else {
          showError(data.error || 'Invalid credentials. Access denied.');
        }
      } catch (err) {
        showError('Network connection error. Please try again.');
      } finally {
        submitBtn.disabled = false;
        btnText.textContent = 'Sign In to Admin Console';
        btnSpinner.classList.add('hidden');
      }
    });

    function showError(msg) {
      errorMessage.textContent = msg;
      errorBanner.classList.remove('hidden');
      const card = document.querySelector('.bg-dark-900\\/90');
      card.classList.add('shake-anim');
      setTimeout(() => card.classList.remove('shake-anim'), 400);
      secretInput.focus();
    }
  </script>
</body>
</html>
